<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
<div layout:fragment = "content">
    <div class = "container">
        <h4 class = "jumbotron bg-light p-4 rounded-4 my-4 fw-semibold">
            Login
        </h4>
        <div class = "card">
            <div class = "card-header">
                <h5 class = "card-title fw-semibold" >
                    Login
                </h5>
            </div>



            <div class = "card-body">
                <form th:action = "@{/login}" th:object="${loginForm}" method = "post">
                    <div class = "mb-1"><label for = "usernameOrEmail" class = "form-label">Username Or Email:</label>
                        <input class = "form-control" type = "text" th:field = "*{usernameOrEmail}" id = "usernameOrEmail">

                        <label for = "password" class = "form-label">Password:</label>
                        <input type = "text" class = "form-control" th:field="*{password}" id = "password">


                        <button class = "btn btn-primary mt-2" type = "submit">Submit</button></div>

                </form>

            </div>
        </div>

    </div>
</div>

</body>
</html>
