<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <div layout:fragment="content" >
        <div class = "container">
            <div class = "jumbotron bg-light p-4 rounded-3 my-4">
                <p class="lead fw-semibold" >Register Your Account</p>
            </div>
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Create An Account</h5>
                </div>

                <div class="card-body">

                    <form th:action="@{/register}" th:object="${registerNewUserForm}" method="post" id="form">
                        <div class = "mb-2">
                            <label for="username" class="form-label">Username: </label>
                            <input type = "text" class = "form-control" id="username"
                                   th:field="*{username}"
                                   placeholder="username">
                        </div>

                        <div class = "mb-2">
                            <label for="email" class = "form-label">Email: </label>
                            <input type="text" class = "form-control" id = "email"
                                   th:field = "*{email}"
                                   placeholder="example@domain">
                        </div>

                        <div class = "mb-3">
                            <label for="password" class = "form-label">Password: </label>
                            <input type="text" class = "form-control" id = "password"
                                   th:field = "*{password}"
                                   placeholder="password">
                        </div>

                        <div id="successMessage" class = "alert alert-success d-none mb-3" role = "alert">
                            Registration Successful! Redirecting...
                        </div>

                        <div>
                            <button type="submit" class = "btn btn-primary" id = "submitBtn">Submit</button>
                        </div>

                    </form>

                    <script>
                        const form = document.getElementById('form');
                        const submitBtn = document.getElementById('submitBtn');
                        const successMessage = document.getElementById('successMessage');

                        form.addEventListener('submit', function (event){
                            event.preventDefault();

                            successMessage.classList.remove('d-none');
                            submitBtn.disabled = true;

                            setTimeout(()=>{
                                form.submit();
                            }, 3000)
                        })
                    </script>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
